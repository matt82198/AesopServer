spring:
  application:
    name: AesopServer
  threads:
    virtual:
      enabled: true

server:
  port: 8870

aesop:
  brain:
    aesop-root: "${AESOP_ROOT:./aesop}"
    conductor-root: "${CONDUCTOR_ROOT:./conductor3}"
  db-path: "${AESOP_DB_PATH:./aesop/state/tracker_events.db}"
  inbox-path: "${AESOP_INBOX_PATH:}"
  server-token: "${AESOP_SERVER_TOKEN:}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    app:
      encoding: "@project.build.sourceEncoding@"
      java:
        source: "@java.version@"
        target: "@java.version@"
